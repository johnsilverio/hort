[package]
name = "hort"
version = "0.1.0"
edition = "2024"
# MSRV is the max of the youki `libcontainer` floor (Rust 1.85, edition 2024) and the std
# floors hort's own code needs (`File::try_lock` and `io::pipe`, both stabilized by 1.89).
# Bumping the youki crates may raise it.
rust-version = "1.89"
description = "Terminal-operated, agent-agnostic manager of ephemeral sandboxes (a git worktree + an embedded-libcontainer OCI container) for running CLI LLM agents in unrestricted mode without exposing the host"
license = "AGPL-3.0-only"
repository = "https://github.com/johnsilverio/hort"
readme = "README.md"
keywords = ["sandbox", "container", "llm", "agent", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Privileged integration & acceptance suites (C1–C6) need real user namespaces,
# a prepared rootfs, and pasta. They are `#[ignore]`-by-default and/or gated on
# this feature, run only in CI that provides them (testing.md §4.3–§4.4).
privileged-tests = []

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
humantime = "2.3.0"
inotify = { version = "0.11.5", default-features = false }
json-strip-comments = "3.1.1"
landlock = "0.4.7"
libc = "0.2.189"
libcontainer = "0.7.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tls-parser = "0.12.2"

# --- Dependencies the remaining features will bring in ---
# Each one is kept commented until the code that uses it exists, so the build never
# carries a crate (or the system libraries some of them need) for nothing. Confirm the
# live version before uncommenting: these move fast enough that a remembered version is
# usually the wrong one.
#
# libcgroups = "0.7.0"     # read a sandbox's process list from its cgroup (the session probe)
# dialoguer = "0.12.0"     # the first-run configuration prompts, nothing else

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serial_test = "3.5.0"
tempfile = "3.27.0"
